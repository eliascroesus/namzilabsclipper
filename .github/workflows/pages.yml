# Builds the clipper app (app/) and publishes it on GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy the app

on:
  push:
    branches: [claude/laughing-wozniak-zg8a1n, main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      # The mimic page's speech model (NVIDIA Parakeet TDT 0.6B v3, int8, CC BY 4.0), from
      # sherpa-onnx's release: served by this site so the page can fetch it (about 670 MB,
      # downloaded once per browser). Kept in the Actions cache between deploys.
      - uses: actions/cache@v4
        id: asr
        with:
          path: app/.asr
          key: parakeet-tdt-0.6b-v3-int8
      - if: steps.asr.outputs.cache-hit != 'true'
        run: |
          mkdir -p .asr && cd .asr
          curl -sSfL -o m.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8.tar.bz2
          tar xjf m.tar.bz2 --strip-components=1 --wildcards '*/encoder.int8.onnx' '*/decoder.int8.onnx' '*/joiner.int8.onnx' '*/tokens.txt'
          rm m.tar.bz2
      - run: mkdir -p dist/models/parakeet-v3 && cp .asr/encoder.int8.onnx .asr/decoder.int8.onnx .asr/joiner.int8.onnx .asr/tokens.txt dist/models/parakeet-v3/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
